server.port=8081
spring.application.name=flight-service

# PostgreSQL database (persistent — data stays after restart)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flightdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fms_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# The secret key clients must send in the X-API-KEY header
flight.api.key=FLIGHT-SERVICE-SECRET-KEY-2026