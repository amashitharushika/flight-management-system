server.port=8083
spring.application.name=user-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fms_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

user.api.key=USER-SERVICE-SECRET-KEY-2026