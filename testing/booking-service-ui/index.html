<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Service — Flight Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ Booking Service</h1>
            <p class="subtitle">Manage flight bookings</p>
        </header>

        <div class="config-bar">
            <label for="apiKey">API Key:</label>
            <input type="text" id="apiKey" value="BOOKING-SERVICE-SECRET-KEY-2026">
        </div>

        <div class="grid">

            <!-- Create Booking -->
            <section class="card">
                <h2>Create Booking</h2>
                <form id="createForm">
                    <input type="number" id="flightId" placeholder="Flight ID" required>
                    <input type="number" id="userId" placeholder="User ID" required>
                    <input type="text" id="passengerName" placeholder="Passenger Name" required>
                    <input type="text" id="seatNumber" placeholder="Seat Number" required>
                    <button type="submit">Create Booking</button>
                </form>
            </section>

            <!-- Get Booking By Id -->
            <section class="card">
                <h2>Find Booking by ID</h2>
                <form id="getByIdForm">
                    <input type="number" id="searchId" placeholder="Booking ID" required>
                    <button type="submit">Search</button>
                </form>
            </section>

            <!-- Get Bookings By User -->
            <section class="card">
                <h2>Bookings by User</h2>
                <form id="getByUserForm">
                    <input type="number" id="searchUserId" placeholder="User ID" required>
                    <button type="submit">View All</button>
                </form>
            </section>

        </div>

        <!-- Results -->
        <section class="results">
            <h2>Results</h2>
            <div id="output" class="output">No results yet — try an action above.</div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
