server.port=8082
spring.application.name=booking-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bookingdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fms_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

booking.api.key=BOOKING-SERVICE-SECRET-KEY-2026