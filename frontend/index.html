<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlightorFight — Flight Management</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="content" style="max-width: 640px;">
    <div class="hero">
      <span class="eyebrow">Now boarding</span>
      <h1>Book flights that<br/>feel like clear skies</h1>
      <p>Search, book, and manage your flights in one calm, uncluttered place — no clutter, no turbulence.</p>
    </div>

    <div class="cloud-card" style="max-width: 400px; margin: 0 auto; text-align: center;">
      <h3 style="margin-bottom: 8px;">Welcome aboard</h3>
      <p style="color: var(--ink-soft); font-size: 14px; margin-bottom: 24px;">Sign in to search flights and manage your bookings.</p>
      <button class="btn btn-google" id="google-signin">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c9.8 0 19-7.1 19-19.5 0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13.5 24 13.5c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.4 0-13.8 4.2-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.4 0 10.4-2 14.1-5.5l-6.5-5.5C29.6 34.3 26.9 35 24 35c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.9 39.3 16.4 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.4 5.8l6.5 5.5C41 36.5 44 30.9 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
        <span>Sign in with Google</span>
      </button>
    </div>

    <p class="footer-note">Flight Management System — Service-Oriented Computing coursework project</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/clouds.js"></script>
<script>
  document.getElementById("google-signin").addEventListener("click", () => {
    window.location.href = `${CONFIG.GATEWAY_BASE}/oauth2/authorization/google`;
  });

  // If already signed in, skip straight to search.
  (async () => {
    try {
      const res = await fetch(`${CONFIG.GATEWAY_BASE}/api/session/me`, { credentials: "include" });
      if (res.ok) window.location.href = "search.html";
    } catch (e) { /* not signed in — stay on this page */ }
  })();
</script>
</body>
</html>
